[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labdisk"
version = "0.1.0"
description = "Always-current storage scans, quota alerts and trim lists for shared GPFS/Slurm clusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
labdisk = "labdisk.cli:main"

[tool.setuptools]
packages = ["labdisk"]
